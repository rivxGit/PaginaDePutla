<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Putla Villa de Guerrero - Galería Dinámica</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #fdfdfd;
            padding: 40px 20px;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 { color: #d35400; margin-bottom: 10px; }
        p.subtitulo { color: #666; margin-bottom: 40px; }

        .grid-tarjetas {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 25px;
            width: 100%;
            max-width: 1100px;
        }

        .tarjeta-container {
            height: 350px;
            perspective: 1000px;
            cursor: pointer;
        }

        .tarjeta-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
            border-radius: 15px;
            box-shadow: 0 8px 15px rgba(0,0,0,0.1);
        }

        /* Clase que activa el giro */
        .rotar { transform: rotateY(180deg); }

        .cara {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 15px;
            overflow: hidden; /* Para que la imagen no se salga de las esquinas */
            display: flex;
            flex-direction: column;
        }

        /* CARA FRONTAL (IMAGEN) */
        .adelante {
            background: white;
            border: 1px solid #eee;
        }

        .adelante img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Ajusta la imagen al cuadro sin deformarla */
        }

        .etiqueta-frontal {
            position: absolute;
            bottom: 0;
            width: 100%;
            background: rgba(0, 0, 0, 0.6);
            color: white;
            padding: 10px;
            text-align: center;
            font-weight: bold;
        }

        /* CARA TRASERA (INFORMACIÓN) */
        .atras {
            background: #d35400;
            color: white;
            transform: rotateY(180deg);
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }

        .atras h3 { margin-top: 0; border-bottom: 1px solid rgba(255,255,255,0.3); padding-bottom: 10px; }
    </style>
</head>
<body>

    <h1>Putla Villa de Guerrero</h1>
    <p class="subtitulo">Haz clic en una imagen para conocer más</p>

    <div class="grid-tarjetas" id="contenedor">
        <!-- Las tarjetas se generan automáticamente -->
    </div>

    <script>
        // CONFIGURACIÓN DE TUS IMÁGENES Y TEXTOS
        // Para poner tus fotos, cambia "imagen1.jpg", etc., por el nombre de tus archivos.
        const datos = [
            { img: "tiliche.jpg", titulo: "El Tiliche", info: "Hecho de retazos de tela, representa la alegría del pueblo." },
            { img: "iglesia.jpg", titulo: "Parroquia", info: "Templo histórico de la Inmaculada Concepción." },
            { img: "rio.jpg", titulo: "Río Copala", info: "Hermosos paisajes naturales para relajarse." },
            { img: "mole.jpg", titulo: "Gastronomía", info: "Famoso mole de achiote, orgullo de Putla." },
            { img: "pan.jpg", titulo: "Pan de Yema", info: "Tradición horneada con recetas ancestrales." },
            { img: "baile.jpg", titulo: "Las Mascaritas", info: "Elegancia y tradición en cada paso de danza." },
            { img: "mercado.jpg", titulo: "Día de Plaza", info: "El corazón del comercio en la región Mixteca." },
            { img: "artesania.jpg", titulo: "Máscaras", info: "Artesanos que dan vida a la madera y el estropajo." },
            { img: "sabino.jpg", titulo: "El Sabino", info: "Árbol milenario cargado de leyendas locales." },
            { img: "carnaval.jpg", titulo: "Carnaval", info: "¡La fiesta más grande e importante de Putla!" }
        ];

        const contenedor = document.getElementById('contenedor');

        // Generar las tarjetas
        datos.forEach((item, index) => {
            const cardHtml = `
                <div class="tarjeta-container" onclick="gestionarGiro(this)">
                    <div class="tarjeta-inner">
                        <div class="cara adelante">
                            <img src="${item.img}" alt="${item.titulo}">
                            <div class="etiqueta-frontal">${item.titulo}</div>
                        </div>
                        <div class="cara atras">
                            <h3>${item.titulo}</h3>
                            <p>${item.info}</p>
                            <small>Volver</small>
                        </div>
                    </div>
                </div>
            `;
            contenedor.innerHTML += cardHtml;
        });

        // LÓGICA PARA CERRAR LA ANTERIOR Y ABRIR LA NUEVA
        function gestionarGiro(elemento) {
            const interior = elemento.querySelector('.tarjeta-inner');
            const estaAbierta = interior.classList.contains('rotar');

            // 1. Buscamos todas las tarjetas y las cerramos
            const todasLasTarjetas = document.querySelectorAll('.tarjeta-inner');
            todasLasTarjetas.forEach(t => t.classList.remove('rotar'));

            // 2. Si la que tocamos NO estaba abierta, ahora la abrimos
            // (Si ya estaba abierta, solo se cierra con el paso anterior)
            if (!estaAbierta) {
                interior.classList.add('rotar');
            }
        }
    </script>

</body>
</html>
