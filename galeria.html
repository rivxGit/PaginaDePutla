</head>
<body>
    <nav class="menu-navegacion">
    <div class="logo">
        <span class="texto-logo">PUTLA</span> 
        <span class="sub-logo">VILLA DE GUERRERO</span>
    </div>
    <ul class="lista-menu">
        <li><a href="index.html">Inicio</a></li>

    <section class="seccion-formulario">
        <div class="contenedor"> 
            <h2 class="titulo-seccion">Compartir Fotografías</h2> 
            <p class="subtitulo">Sube tu foto de Tiliches, Mascaritas o comparsas. Aparecerá en el collage tras ser aprobada.</p>

            <form id="form-subir-foto" class="formulario-estilizado">
                <div class="grupo-campo">
                    <label for="txt-titulo">¿Qué pasa en la foto? (Título corto):</label>
                    <input type="text" id="txt-titulo" placeholder="Ej. Traje de Tiliche tradicional" required>
                </div>

                <div class="grupo-campo">
                    <label for="file-imagen">Selecciona tu fotografía:</label>
                    <input type="file" id="file-imagen" accept="image/*" required>
                </div>

                <button type="submit" id="btn-enviar" class="btn-principal">Enviar</button>
            </form>
        </div>
    </section>

    <div class="contenedor">
        <div id="collage-galeria" class="collage-contenedor"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="subir.js"></script> </body>
</html>
