<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería del Carnaval de Putla</title>
    
    <link rel="stylesheet" href="css/carnaval.css">
    <link rel="stylesheet" href="css/galeria.css">
</head>
<body>
    
    <section class="seccion-formulario">
        <div class="contenedor"> 
            <h2 class="titulo-seccion">Compartir Fotografías</h2> 
            <p class="subtitulo">Sube tu foto de Tiliches, Mascaritas o comparsas. Aparecerá en el collage tras ser aprobada.</p>

            <form id="form-subir-foto" class="formulario-estilizado">
                <div class="grupo-campo">
                    <label for="txt-titulo">¿Qué pasa en la foto? (Título corto):</label>
                    <input type="text" id="txt-titulo" placeholder="Ej. Traje de Tiliche tradicional" required>
                </div>

                <div class="grupo-campo">
                    <label for="file-imagen">Selecciona tu fotografía (.jpg, .png):</label>
                    <input type="file" id="file-imagen" accept="image/*" required>
                </div>

                <button type="submit" id="btn-enviar" class="btn-principal">Enviar al Administrador</button>
            </form>
        </div>
    </section>

    <div class="contenedor">
        <div id="collage-galeria" class="grid-collage">
            </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="js/config.js"></script>

    <script src="subir.js"></script>
</body>
</html>
